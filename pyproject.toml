[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpie"
version = "0.1.0"
description = "Global Purchase Intent Engine - AI-powered affiliate conversion system"
requires-python = ">=3.12"
authors = [
    {name = "GPIE Team"}
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.9.0",
    "pydantic-settings==2.4.0",
    "sqlalchemy==2.0.37",
    "alembic==1.14.1",
    "psycopg[binary]==3.20.0",
    "pgvector==0.3.1",
    "redis==5.1.1",
    "langgraph==0.2.12",
    "langchain-core==0.3.5",
    "langchain==0.3.6",
    "langchain-openai==0.2.4",
    "langchain-anthropic==0.2.2",
    "langchain-google-genai==2.0.2",
    "httpx==0.28.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "python-dateutil==2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "mypy==1.14.1",
    "ruff==0.8.2",
    "black==24.10.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "worker: Worker tests",
    "api: API tests",
    "e2e: End-to-end tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
]
ignore = [
    "E501",   # line too long (handled by formatter)
]
